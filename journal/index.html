<style>

cv.onpointerdown=e=>{if(!annOn)return;e.preventDefault();cv.setPointerCapture(e.pointerId);const p=pt(e);undo.push(ink.slice());redo=[];if(tool=='er'){dr={er:1,ch:0};era(p)}else{dr={t:tool,c:ic,w:tool=='hl'?+$('#iw').value*4:+$('#iw').value,p:[...p]};ink.push(dr);drawInk()}};
cv.onpointermove=e=>{if(!dr)return;const p=pt(e);if(dr.er)return era(p);const W=sheet.clientWidth,l=dr.p.length;if(Math.hypot((p[0]-dr.p[l-2])*W/1000,p[1]-dr.p[l-1])<2)return;dr.p.push(...p);cancelAnimationFrame(raf);raf=requestAnimationFrame(drawInk)};
cv.onpointerup=cv.onpointercancel=()=>{if(dr&&dr.er&&!dr.ch)undo.pop();dr=null;touch()};
function era(p){const W=sheet.clientWidth,r=+$('#iw').value*3+8,n=ink.filter(s=>!s.p.some((v,i)=>i%2==0&&Math.hypot((v-p[0])*W/1000,s.p[i+1]-p[1])<r));if(n.length!=ink.length){ink=n;dr.ch=1;drawInk()}}
addEventListener('pagehide',()=>{cur&&!$('#edit').hidden&&commit()});document.addEventListener('visibilitychange',()=>{document.hidden&&cur&&!$('#edit').hidden&&commit()});
</script></body></html>
