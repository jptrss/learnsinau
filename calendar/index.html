</style><style>:root{--a:#7c5cff;--a2:#ff5fa2;--a3:#19c3d6}body{background:radial-gradient(900px 520px at 6% -5%,rgba(150,120,255,.35),transparent 60%),radial-gradient(800px 500px at 100% 8%,rgba(255,120,190,.28),transparent 60%),radial-gradient(700px 500px at 50% 110%,rgba(60,200,230,.28),transparent 60%),linear-gradient(135deg,var(--bg),var(--bg2));background-attachment:fixed}.card{border-radius:22px;box-shadow:0 6px 24px rgba(90,70,200,.12)}.btn{background:linear-gradient(135deg,var(--a),var(--a2));box-shadow:0 4px 12px rgba(124,92,255,.35)}.btn.g{background:var(--c);box-shadow:none}.tab.on{background:linear-gradient(135deg,var(--a),var(--a2));box-shadow:0 4px 12px rgba(124,92,255,.35)}h2{background:linear-gradient(90deg,var(--a),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}header.card{background:linear-gradient(120deg,rgba(124,92,255,.28),rgba(255,95,162,.22),rgba(25,195,214,.22))}#grt{background:linear-gradient(90deg,var(--a),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent;font-size:1.6rem}#pt{background:linear-gradient(90deg,var(--a3),var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}.cell:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(124,92,255,.25)}.bar i{background:linear-gradient(90deg,var(--a3),var(--a2))}</style></head><body>

<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,"0"),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,pd=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d,12)},add=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)},diff=(a,b)=>Math.round((pd(b)-pd(a))/864e5),uid=()=>Date.now()*1e3+Math.floor(Math.random()*1e3);
const JP=[["07:30","08:10"],["08:15","08:55"],["09:15","09:55"],["10:00","10:40"],["10:45","11:25"],["11:30","12:10"],["13:05","13:45"],["13:50","14:30"],["14:35","15:15"]],DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],STAT=["Not Started","Passed","Failed","Completed"];
const KC={school:"#6c5ce7",task:"#f59e0b",exam:"#ef4444",comp:"#10b981",todo:"#38bdf8"},CATS={Organization:"#8b5cf6",Personal:"#ec4899","Study Target":"#14b8a6",Sports:"#f97316",Other:"#64748b"};
const FB_CONFIG=null; /* paste your Firebase web config object here when self-hosting */
let fb=null,U=null,D=null,S={tab:"cal",view:"month",date:ds(new Date()),ns:[{name:"Round 1",dt:"",loc:"",status:"Not Started"}],nt:{}},mem={};
const ld=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return mem[k]?JSON.parse(mem[k]):null}},sv=(k,v)=>{const j=JSON.stringify(v);try{localStorage.setItem(k,j)}catch(e){mem[k]=j}};
const blank=()=>({schedules:{},assignments:[],competitions:[],events:[],daily_todos:{},ov:{},done:{},focus:{},pkgs:[],cats:{}}),COLS=["schedules","assignments","competitions","events","daily_todos"];
function toast(m){const e=document.createElement("div");e.className="card pop";e.style.padding="10px";e.textContent=m;$("#toasts").append(e);setTimeout(()=>e.remove(),5000)}
async function initFB(){if(!FB_CONFIG)return $("#mode").textContent="Demo mode: data is stored in this browser only. Add a Firebase config to sync with Firestore.";
 for(const f of["app","auth","firestore"])await new Promise(r=>{const s=document.createElement("script");s.src=`https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-${f}-compat.js`;s.onload=r;document.head.append(s)});firebase.initializeApp(FB_CONFIG);fb=firebase}
async function auth(m){const e=$("#em").value.trim(),p=$("#pw").value;if(!e||p.length<6)return toast("Enter an email and a password of 6+ characters");
 try{if(fb){const r=m=="up"?await fb.auth().createUserWithEmailAndPassword(e,p):await fb.auth().signInWithEmailAndPassword(e,p);return enter({uid:r.user.uid,email:e})}
 const us=ld("pams:users")||{};if(m=="up"){if(us[e])return toast("Account already exists");us[e]=btoa(p);sv("pams:users",us)}else if(us[e]!=btoa(p))return toast("Wrong email or password");
 enter({uid:"l_"+btoa(e).replace(/=/g,""),email:e})}catch(x){toast(x.message)}}

async function enter(u){U=u;D=Object.assign(blank(),ld("pams:"+u.uid)||{});
 if(fb)try{const db=fb.firestore();for(const c of COLS){const s=await db.collection("users").doc(u.uid).collection(c).doc("data").get();if(s.exists)D[c]=s.data().v}}catch(e){toast("Cloud load failed, using local copy")}
 $("#auth").style.display="none";$("#app").style.display="block";$("#nav").innerHTML=$("#bnav").innerHTML=[["cal","Calendar","📅"],["school","School","🏫"],["comp","Contests","🏆"],["ev","Events","🎯"]].map(t=>`<div class="tab" data-t="${t[0]}" onclick="go('${t[0]}')">${t[2]} ${t[1]}</div>`).join("");R();chk()}
function out(){fb&&fb.auth().signOut();U=null;$("#app").style.display="none";$("#auth").style.display="flex"}
function save(){sv("pams:"+U.uid,D);if(fb)try{const db=fb.firestore();COLS.forEach(c=>db.collection("users").doc(U.uid).collection(c).doc("data").set({v:JSON.parse(JSON.stringify(D[c]))}))}catch(e){}}
function theme(){const r=document.documentElement,d=getComputedStyle(r).getPropertyValue("--bg").trim()=="#12112a";r.dataset.theme=d?"light":"dark"}
/* ---------- engine ---------- */
function occ(e,d){if(d<e.date)return 0;const r=e.rec||{t:"none"},n=+r.n||1,s=pd(e.date),x=pd(d);
 if(r.t=="none")return d<=(e.endDate||e.date);if(r.t=="daily")return diff(e.date,d)%n==0;
 if(r.t=="weekly")return Math.floor(diff(add(e.date,-s.getDay()),d)/7)%n==0&&(r.days&&r.days.length?r.days:[s.getDay()]).includes(x.getDay());
 const mo=(x.getFullYear()-s.getFullYear())*12+x.getMonth()-s.getMonth();
 if(r.t=="monthly")return x.getDate()==s.getDate()&&mo%n==0;return x.getDate()==s.getDate()&&x.getMonth()==s.getMonth()&&(x.getFullYear()-s.getFullYear())%n==0}
function items(d){const o=[],dow=pd(d).getDay(),ov=D.ov[d]||{},P=(id,time,title,sub,k,c,end)=>o.push({id,time:time||"",end,title,sub,k,c:c||KC[k]});
 if(dow%6&&!ov.school)JP.forEach((j,i)=>{const x=D.schedules[dow+"-"+i];x&&x.s&&P("jp"+i,j[0],`JP ${i+1} · ${x.s}`,[x.r,x.t].filter(Boolean).join(" · "),"school",0,j[1])});
 D.assignments.forEach(a=>a.due.slice(0,10)==d&&P("a"+a.id,a.due.slice(11),`${a.type}: ${a.subject} – ${a.desc}`,[a.teacher,a.pri+" priority"].filter(Boolean).join(" · "),a.type=="Exam"?"exam":"task"));
 D.competitions.forEach(c=>{let dead;[...c.stages].sort((x,y)=>x.dt<y.dt?-1:1).forEach(s=>{if(!dead&&s.dt&&s.dt.slice(0,10)==d)P("c"+c.id+"s"+s.id,s.dt.slice(11),`${c.name} – ${s.name}`,[s.loc,s.status].filter(Boolean).join(" · "),"comp");if(s.status=="Failed")dead=1})});
 D.events.forEach(e=>occ(e,d)&&P("e"+e.id,e.allday?"":e.time,e.title,e.cat,"event",e.color,e.end));
 (D.daily_todos[d]||[]).forEach(t=>P("t"+t.id,"","☐ "+t.t,"To-do","todo"));
 return o.filter(x=>!(ov.hide||[]).includes(x.id)).sort((a,b)=>a.time<b.time?-1:1)}
const dk=(x,d)=>x.id+"@"+d,isDone=(x,d)=>!!D.done[dk(x,d)];
function meet(sub,n=8){const o=[],t=ds(new Date());for(let i=0;i<120&&o.length<n;i++){const d=add(t,i),dow=pd(d).getDay();if(dow%6&&!(D.ov[d]||{}).school)JP.forEach((j,k)=>{const x=D.schedules[dow+"-"+k];x&&x.s.toLowerCase()==sub.toLowerCase()&&!o.some(m=>m.d==d)&&o.push({d,t:j[0]})})}return o.filter(m=>new Date(m.d+"T"+m.t)>new Date())}
const fmt=m=>pd(m.d).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})+" "+m.t,subs=()=>[...new Set(Object.values(D.schedules).map(x=>x.s).filter(Boolean))];
const mins=t=>+t.slice(0,2)*60+ +t.slice(3,5),hm=m=>pad(m/60|0)+":"+pad(m%60);
function wl(d){let s=0;items(d).forEach(x=>s+=x.k=="exam"||x.k=="comp"?3:x.k=="task"?1.5:x.k=="event"?.5:0);return s}
const lvl=s=>s>=6?["#ef4444","Overloaded"]:s>=3?["#f59e0b","Busy"]:["#10b981","Light"];
function wlw(){const t=ds(new Date()),days=[...Array(7)].map((_,i)=>add(t,i)),sc=days.map(wl),min=days[sc.indexOf(Math.min(...sc))],sel=items(S.date).filter(x=>x.time&&x.k!="todo");
 const iv=sel.map(x=>[mins(x.time),x.end?mins(x.end):mins(x.time)+45,x]),cf=[];iv.forEach((a,i)=>iv.slice(i+1).forEach(b=>a[0]<b[1]&&b[0]<a[1]&&cf.push(`${a[2].title} ⚔ ${b[2].title}`)));
 const win=[];let cur=930;iv.filter(a=>a[1]>930&&a[0]<1260).sort((a,b)=>a[0]-b[0]).concat([[1260,1260]]).forEach(a=>{if(a[0]-cur>=50&&win.length<3)win.push(`Study ${hm(cur+10)}–${hm(cur+60)}, then rest 10 min`);cur=Math.max(cur,a[1])});
 const hot=days.filter((_,i)=>sc[i]>=6);
 return `<div class="card fade mt-3"><h2>🤖 Workload Balance</h2><div class="flex gap-1 mb-2">${days.map((d,i)=>`<div class="flex-1 text-center" onclick="sel('${d}')" style="cursor:pointer"><div style="height:${10+Math.min(sc[i],8)*7}px;background:${lvl(sc[i])[0]};border-radius:6px"></div><div class="m">${DAYS[pd(d).getDay()]}</div></div>`).join("")}</div>
 ${hot.map(d=>`<div style="color:#ef4444">🔴 ${d}: overloaded. Move low-priority tasks to ${min} and start prep 2 days earlier.</div>`).join("")}${sc.some(s=>s>=3&&s<6)&&!hot.length?`<div style="color:#f59e0b">🟡 Some busy days ahead: spread tasks over lighter days (${min} is lightest).</div>`:""}
 ${cf.map(c=>`<div style="color:#ef4444">⚠ Conflict: ${esc(c)}</div>`).join("")}<div class="m mt-1">${win.length?"Ideal for "+S.date+": "+win.join(" · "):"No free study window between 15:30 and 21:00 on "+S.date+"; keep a short break."}</div></div>`}
/* ---------- views ---------- */
function go(t){S.tab=t;R()}
function R(){const f={cal,school,comp,ev}[S.tab];$("#main").innerHTML=`<div class="fade">${f()}</div>`;document.querySelectorAll(".tab").forEach(e=>e.classList.toggle("on",e.dataset.t==S.tab));
 $("#ptask").innerHTML=`<option value="">No linked task</option>`+D.assignments.filter(a=>!isDone({id:"a"+a.id},a.due.slice(0,10))).map(a=>`<option value="${a.id}" ${P.task==a.id?"selected":""}>${esc(a.subject)}: ${esc(a.desc)}</option>`).join("");chk()}
function sel(d){S.date=d;R()}
function nav(n){const d=S.date;S.date=S.view=="month"?ds(new Date(pd(d).getFullYear(),pd(d).getMonth()+n,1,12)):add(d,n*(S.view=="week"?7:1));R()}
function cal(){const d=S.date,t=pd(d);let g="";
 if(S.view=="month"){const f=new Date(t.getFullYear(),t.getMonth(),1,12),st=add(ds(f),-f.getDay());g=`<div class="grid grid-cols-7 gap-1">${DAYS.map(x=>`<div class="m text-center">${x}</div>`).join("")}${[...Array(42)].map((_,i)=>{const c=add(st,i),it=items(c).filter(x=>x.k!="todo"),s=wl(c);return `<button class="cell ${c==d?"sel":""}" style="${pd(c).getMonth()!=t.getMonth()?"opacity:.45":""}" onclick="sel('${c}')"><div class="text-xs font-bold">${pd(c).getDate()}${c==ds(new Date())?" •":""}</div><div>${it.slice(0,4).map(x=>`<span class="dot" style="background:${x.c}"></span>`).join("")}</div>${s>=3?`<span class="bd" style="background:${lvl(s)[0]}">${s>=6?"!!":"!"}</span>`:""}</button>`}).join("")}</div>`}
 if(S.view=="week"){const st=add(d,-t.getDay());g=`<div class="grid md:grid-cols-7 gap-2">${[...Array(7)].map((_,i)=>{const c=add(st,i);return `<div class="cell ${c==d?"sel":""}" onclick="sel('${c}')"><b class="text-xs">${DAYS[i]} ${pd(c).getDate()}</b>${items(c).map(x=>`<div class="text-xs" style="border-left:3px solid ${x.c};padding-left:4px;margin-top:2px">${x.time} ${esc(x.title)}</div>`).join("")}</div>`}).join("")}</div>`}
 const it=items(d),ov=D.ov[d]||{};
 return `<div class="card"><div class="flex flex-wrap items-center gap-2 mb-3"><button class="btn g" onclick="nav(-1)">‹</button><b class="flex-1 text-center">${t.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</b><button class="btn g" onclick="nav(1)">›</button><button class="btn g" onclick="sel(ds(new Date()))">Today</button>
 ${["day","week","month"].map(v=>`<button class="btn ${S.view==v?"":"g"}" onclick="S.view='${v}';R()">${v[0].toUpperCase()+v.slice(1)}</button>`).join("")}</div>${g}</div>
 <div class="card mt-3"><h2>Agenda ${ov.school?`<span class="bd" style="background:#64748b">School off: ${esc(ov.why||"")}</span>`:""}</h2>${it.map(x=>`<div class="flex items-center gap-2 py-1" style="border-bottom:1px solid var(--b)"><input type="checkbox" ${isDone(x,d)?"checked":""} onchange="tg('${dk(x,d)}')"><span class="bd" style="background:${x.c}">${x.k=="event"?"event":x.k}</span><div class="flex-1" style="${isDone(x,d)?"text-decoration:line-through;opacity:.5":""}"><div class="text-sm">${x.time?x.time+(x.end?"–"+x.end:"")+" · ":""}${esc(x.title)}</div><div class="m">${esc(x.sub||"")}</div></div><button onclick="hide('${x.id}')" title="Remove on this date only">✕</button></div>`).join("")||`<div class="m">Nothing scheduled.</div>`}
 <div class="flex gap-2 mt-3"><input id="qt" class="in" placeholder="Quick add to-do for this date" onkeydown="event.key=='Enter'&&qa()"><button class="btn" onclick="qa()">Add</button></div>
 <div class="mt-3 grid sm:grid-cols-4 gap-2 items-end"><div><label>School off from</label><input id="o1" type="date" class="in" value="${d}"></div><div><label>to</label><input id="o2" type="date" class="in" value="${d}"></div><div><label>Reason</label><select id="o3" class="in"><option>Sick leave</option><option>Dispensation</option><option>National holiday</option></select></div><button class="btn" onclick="so()">Excuse school</button></div>
 ${ov.school?`<button class="btn g mt-2" onclick="delete D.ov['${d}'].school;save();R()">Restore school for this day</button>`:""}</div>${wlw()}`}
function tg(k){D.done[k]=!D.done[k];save();R()}
