<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Academic & Event Hub</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>

@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12112a;--bg2:#241447;--c:rgba(255,255,255,.07);--t:#ecebff;--m:#a09ec4;--b:rgba(255,255,255,.13)}}
:root[data-theme=dark]{--bg:#12112a;--bg2:#241447;--c:rgba(255,255,255,.07);--t:#ecebff;--m:#a09ec4;--b:rgba(255,255,255,.13)}
html,body{height:auto;min-height:100%}body{margin:0;background:linear-gradient(135deg,var(--bg),var(--bg2)) fixed;color:var(--t);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.card{background:var(--c);border:1px solid var(--b);backdrop-filter:blur(14px);border-radius:18px;padding:16px;transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(108,92,231,.15)}
.btn{background:var(--a);color:#fff;border:0;border-radius:12px;padding:8px 14px;font-weight:600;cursor:pointer;transition:.2s}.btn:hover{filter:brightness(1.1);transform:scale(1.03)}.btn.g{background:var(--c);color:var(--t);border:1px solid var(--b)}
.in{width:100%;background:var(--c);border:1px solid var(--b);color:var(--t);border-radius:10px;padding:7px 9px;font-size:14px;box-sizing:border-box}.in option{color:#000}
.m{color:var(--m);font-size:13px}.fade{animation:f .35s ease}@keyframes f{from{opacity:0;transform:translateY(8px)}}
.pop{animation:p .3s ease}@keyframes p{from{opacity:0;transform:scale(.92)}}
.tab{padding:8px 14px;border-radius:12px;cursor:pointer;font-weight:600;color:var(--m)}.tab.on{background:var(--a);color:#fff}
.bd{display:inline-block;border-radius:99px;padding:1px 8px;font-size:11px;font-weight:700;color:#fff}
.cell{min-height:64px;text-align:left;border-radius:12px;border:1px solid var(--b);background:var(--c);color:var(--t);padding:4px;cursor:pointer}.cell.sel{outline:2px solid var(--a)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:2px}
.bar{height:8px;border-radius:9px;background:var(--b);overflow:hidden}.bar i{display:block;height:100%;background:var(--a)}
label{font-size:12px;color:var(--m)}h2{font-weight:700;font-size:18px;margin:0 0 8px}
</style></head><body>
<div id="toasts" style="position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:99;display:grid;gap:6px;max-width:300px"></div>
<div id="auth" class="min-h-screen flex items-center justify-center p-4"><div class="card pop w-full max-w-sm text-center">
<div style="font-size:44px">🎓</div><h1 class="text-2xl font-bold">Calendar: Manage Your Time</h1><p class="m mb-3">Timetable, assignments, competitions and events in one integrated place.</p>

<div class="flex gap-2 mb-2"><button class="btn flex-1" onclick="auth('in')">Sign in</button><button class="btn g flex-1" onclick="auth('up')">Sign up</button></div>

<header class="card flex flex-wrap items-center gap-3 mb-3"><div class="flex-1"><div class="text-xl font-bold" id="grt"></div><div class="m" id="clk" style="font-variant-numeric:tabular-nums;font-size:22px"></div></div>
<span id="bdg" class="bd" style="background:#ef4444;display:none"></span>
<button class="btn g" onclick="notif()" title="Enable notifications">🔔</button><button class="btn g" onclick="theme()">🌓</button><button class="btn g" onclick="expo()">⬇ .ics / Backup</button><button class="btn g" onclick="out()">Log out</button></header>

<aside class="grid gap-3 content-start"><div class="card text-center"><h2>🍅 Pomodoro</h2><div id="pt" class="text-4xl font-bold" style="font-variant-numeric:tabular-nums">25:00</div><div id="pm" class="m mb-2">Focus</div>
<select id="ptask" class="in mb-2" onchange="P.task=this.value"></select>
<div class="flex gap-2 mb-2"><input id="pf" class="in" type="number" value="25" min="1" title="Focus min"><input id="pb" class="in" type="number" value="5" min="1" title="Break min"></div>
<div class="flex gap-2"><button class="btn flex-1" onclick="pp()" id="pbtn">Start</button><button class="btn g" onclick="pr()">Reset</button></div><div class="m mt-2" id="pstat"></div></div>
<div class="card"><h2>⏳ Next competition round</h2><div id="cd" class="m">None scheduled</div></div></aside></div>
<nav class="md:hidden fixed bottom-0 left-0 right-0 flex justify-around p-2" id="bnav" style="background:var(--bg);border-top:1px solid var(--b);padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))"></nav></div>
<div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;align-items:center;justify-content:center;padding:14px"><div class="card pop w-full max-w-lg" style="background:var(--bg)" id="mbox"></div></div>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,"0"),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,pd=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d,12)},add=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)},diff=(a,b)=>Math.round((pd(b)-pd(a))/864e5),uid=()=>Date.now()*1e3+Math.floor(Math.random()*1e3);
const JP=[["07:30","08:10"],["08:15","08:55"],["09:15","09:55"],["10:00","10:40"],["10:45","11:25"],["11:30","12:10"],["13:05","13:45"],["13:50","14:30"],["14:35","15:15"]],DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],STAT=["Not Started","Passed","Failed","Completed"];
const KC={school:"#6c5ce7",task:"#f59e0b",exam:"#ef4444",comp:"#10b981",todo:"#38bdf8"},CATS={Organization:"#8b5cf6",Personal:"#ec4899","Study Target":"#14b8a6",Sports:"#f97316",Other:"#64748b"};
const FB_CONFIG=null; /* paste your Firebase web config object here when self-hosting */
let fb=null,U=null,D=null,S={tab:"cal",view:"month",date:ds(new Date()),ns:[{name:"Round 1",dt:"",loc:"",status:"Not Started"}],nt:{}},mem={};
const ld=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return mem[k]?JSON.parse(mem[k]):null}},sv=(k,v)=>{const j=JSON.stringify(v);try{localStorage.setItem(k,j)}catch(e){mem[k]=j}};
const blank=()=>({schedules:{},assignments:[],competitions:[],events:[],daily_todos:{},ov:{},done:{},focus:{}}),COLS=["schedules","assignments","competitions","events","daily_todos"];
function toast(m){const e=document.createElement("div");e.className="card pop";e.style.padding="10px";e.textContent=m;$("#toasts").append(e);setTimeout(()=>e.remove(),5000)}
async function initFB(){if(!FB_CONFIG)return $("#mode").textContent="Demo mode: data is stored in this browser only. Add a Firebase config to sync with Firestore.";
 for(const f of["app","auth","firestore"])await new Promise(r=>{const s=document.createElement("script");s.src=`https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-${f}-compat.js`;s.onload=r;document.head.append(s)});firebase.initializeApp(FB_CONFIG);fb=firebase}
async function auth(m){const e=$("#em").value.trim(),p=$("#pw").value;if(!e||p.length<6)return toast("Enter an email and a password of 6+ characters");
 try{if(fb){const r=m=="up"?await fb.auth().createUserWithEmailAndPassword(e,p):await fb.auth().signInWithEmailAndPassword(e,p);return enter({uid:r.user.uid,email:e})}
 const us=ld("pams:users")||{};if(m=="up"){if(us[e])return toast("Account already exists");us[e]=btoa(p);sv("pams:users",us)}else if(us[e]!=btoa(p))return toast("Wrong email or password");
 enter({uid:"l_"+btoa(e).replace(/=/g,""),email:e})}catch(x){toast(x.message)}}
async function google(){try{if(fb){const r=await fb.auth().signInWithPopup(new fb.auth.GoogleAuthProvider());return enter({uid:r.user.uid,email:r.user.email})}toast("Google Sign-In needs Firebase; continuing as a demo guest");enter({uid:"guest",email:"guest"})}catch(x){toast(x.message)}}
async function enter(u){U=u;D=Object.assign(blank(),ld("pams:"+u.uid)||{});
 if(fb)try{const db=fb.firestore();for(const c of COLS){const s=await db.collection("users").doc(u.uid).collection(c).doc("data").get();if(s.exists)D[c]=s.data().v}}catch(e){toast("Cloud load failed, using local copy")}
 $("#auth").style.display="none";$("#app").style.display="block";$("#nav").innerHTML=$("#bnav").innerHTML=[["cal","Calendar","📅"],["school","School","🏫"],["comp","Contests","🏆"],["ev","Events","🎯"]].map(t=>`<div class="tab" data-t="${t[0]}" onclick="go('${t[0]}')">${t[2]} ${t[1]}</div>`).join("");R();chk()}
function out(){fb&&fb.auth().signOut();U=null;$("#app").style.display="none";$("#auth").style.display="flex"}
function save(){sv("pams:"+U.uid,D);if(fb)try{const db=fb.firestore();COLS.forEach(c=>db.collection("users").doc(U.uid).collection(c).doc("data").set({v:JSON.parse(JSON.stringify(D[c]))}))}catch(e){}}
function theme(){const r=document.documentElement,d=getComputedStyle(r).getPropertyValue("--bg").trim()=="#12112a";r.dataset.theme=d?"light":"dark"}
/* ---------- engine ---------- */
function occ(e,d){if(d<e.date)return 0;const r=e.rec||{t:"none"},n=+r.n||1,s=pd(e.date),x=pd(d);
 if(r.t=="none")return d<=(e.endDate||e.date);if(r.t=="daily")return diff(e.date,d)%n==0;
 if(r.t=="weekly")return Math.floor(diff(add(e.date,-s.getDay()),d)/7)%n==0&&(r.days&&r.days.length?r.days:[s.getDay()]).includes(x.getDay());
 const mo=(x.getFullYear()-s.getFullYear())*12+x.getMonth()-s.getMonth();
 if(r.t=="monthly")return x.getDate()==s.getDate()&&mo%n==0;return x.getDate()==s.getDate()&&x.getMonth()==s.getMonth()&&(x.getFullYear()-s.getFullYear())%n==0}
function items(d){const o=[],dow=pd(d).getDay(),ov=D.ov[d]||{},P=(id,time,title,sub,k,c,end)=>o.push({id,time:time||"",end,title,sub,k,c:c||KC[k]});
 if(dow%6&&!ov.school)JP.forEach((j,i)=>{const x=D.schedules[dow+"-"+i];x&&x.s&&P("jp"+i,j[0],`JP ${i+1} · ${x.s}`,[x.r,x.t].filter(Boolean).join(" · "),"school",0,j[1])});
 D.assignments.forEach(a=>a.due.slice(0,10)==d&&P("a"+a.id,a.due.slice(11),`${a.type}: ${a.subject} – ${a.desc}`,[a.teacher,a.pri+" priority"].filter(Boolean).join(" · "),a.type=="Exam"?"exam":"task"));
 D.competitions.forEach(c=>{let dead;[...c.stages].sort((x,y)=>x.dt<y.dt?-1:1).forEach(s=>{if(!dead&&s.dt&&s.dt.slice(0,10)==d)P("c"+c.id+"s"+s.id,s.dt.slice(11),`${c.name} – ${s.name}`,[s.loc,s.status].filter(Boolean).join(" · "),"comp");if(s.status=="Failed")dead=1})});
 D.events.forEach(e=>occ(e,d)&&P("e"+e.id,e.allday?"":e.time,e.title,e.cat,"event",e.color,e.end));
 (D.daily_todos[d]||[]).forEach(t=>P("t"+t.id,"","☐ "+t.t,"To-do","todo"));
 return o.filter(x=>!(ov.hide||[]).includes(x.id)).sort((a,b)=>a.time<b.time?-1:1)}
const dk=(x,d)=>x.id+"@"+d,isDone=(x,d)=>!!D.done[dk(x,d)];
function meet(sub,n=8){const o=[],t=ds(new Date());for(let i=0;i<120&&o.length<n;i++){const d=add(t,i),dow=pd(d).getDay();if(dow%6&&!(D.ov[d]||{}).school)JP.forEach((j,k)=>{const x=D.schedules[dow+"-"+k];x&&x.s.toLowerCase()==sub.toLowerCase()&&!o.some(m=>m.d==d)&&o.push({d,t:j[0]})})}return o.filter(m=>new Date(m.d+"T"+m.t)>new Date())}
const fmt=m=>pd(m.d).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})+" "+m.t,subs=()=>[...new Set(Object.values(D.schedules).map(x=>x.s).filter(Boolean))];
const mins=t=>+t.slice(0,2)*60+ +t.slice(3,5),hm=m=>pad(m/60|0)+":"+pad(m%60);
function wl(d){let s=0;items(d).forEach(x=>s+=x.k=="exam"||x.k=="comp"?3:x.k=="task"?1.5:x.k=="event"?.5:0);return s}
const lvl=s=>s>=6?["#ef4444","Overloaded"]:s>=3?["#f59e0b","Busy"]:["#10b981","Light"];
function wlw(){const t=ds(new Date()),days=[...Array(7)].map((_,i)=>add(t,i)),sc=days.map(wl),min=days[sc.indexOf(Math.min(...sc))],sel=items(S.date).filter(x=>x.time&&x.k!="todo");
 const iv=sel.map(x=>[mins(x.time),x.end?mins(x.end):mins(x.time)+45,x]),cf=[];iv.forEach((a,i)=>iv.slice(i+1).forEach(b=>a[0]<b[1]&&b[0]<a[1]&&cf.push(`${a[2].title} ⚔ ${b[2].title}`)));
 const win=[];let cur=930;iv.filter(a=>a[1]>930&&a[0]<1260).sort((a,b)=>a[0]-b[0]).concat([[1260,1260]]).forEach(a=>{if(a[0]-cur>=50&&win.length<3)win.push(`Study ${hm(cur+10)}–${hm(cur+60)}, then rest 10 min`);cur=Math.max(cur,a[1])});
 const hot=days.filter((_,i)=>sc[i]>=6);
 return `<div class="card fade mt-3"><h2>🤖 Workload Balance</h2><div class="flex gap-1 mb-2">${days.map((d,i)=>`<div class="flex-1 text-center" onclick="sel('${d}')" style="cursor:pointer"><div style="height:${10+Math.min(sc[i],8)*7}px;background:${lvl(sc[i])[0]};border-radius:6px"></div><div class="m">${DAYS[pd(d).getDay()]}</div></div>`).join("")}</div>
 ${hot.map(d=>`<div style="color:#ef4444">🔴 ${d}: overloaded. Move low-priority tasks to ${min} and start prep 2 days earlier.</div>`).join("")}${sc.some(s=>s>=3&&s<6)&&!hot.length?`<div style="color:#f59e0b">🟡 Some busy days ahead: spread tasks over lighter days (${min} is lightest).</div>`:""}
 ${cf.map(c=>`<div style="color:#ef4444">⚠ Conflict: ${esc(c)}</div>`).join("")}<div class="m mt-1">${win.length?"Ideal for "+S.date+": "+win.join(" · "):"No free study window between 15:30 and 21:00 on "+S.date+"; keep a short break."}</div></div>`}
/* ---------- views ---------- */
function go(t){S.tab=t;R()}
function R(){const f={cal,school,comp,ev}[S.tab];$("#main").innerHTML=`<div class="fade">${f()}</div>`;document.querySelectorAll(".tab").forEach(e=>e.classList.toggle("on",e.dataset.t==S.tab));
 $("#ptask").innerHTML=`<option value="">No linked task</option>`+D.assignments.filter(a=>!isDone({id:"a"+a.id},a.due.slice(0,10))).map(a=>`<option value="${a.id}" ${P.task==a.id?"selected":""}>${esc(a.subject)}: ${esc(a.desc)}</option>`).join("");chk()}
function sel(d){S.date=d;R()}
function nav(n){const d=S.date;S.date=S.view=="month"?ds(new Date(pd(d).getFullYear(),pd(d).getMonth()+n,1,12)):add(d,n*(S.view=="week"?7:1));R()}
function cal(){const d=S.date,t=pd(d);let g="";
 if(S.view=="month"){const f=new Date(t.getFullYear(),t.getMonth(),1,12),st=add(ds(f),-f.getDay());g=`<div class="grid grid-cols-7 gap-1">${DAYS.map(x=>`<div class="m text-center">${x}</div>`).join("")}${[...Array(42)].map((_,i)=>{const c=add(st,i),it=items(c).filter(x=>x.k!="todo"),s=wl(c);return `<button class="cell ${c==d?"sel":""}" style="${pd(c).getMonth()!=t.getMonth()?"opacity:.45":""}" onclick="sel('${c}')"><div class="text-xs font-bold">${pd(c).getDate()}${c==ds(new Date())?" •":""}</div><div>${it.slice(0,4).map(x=>`<span class="dot" style="background:${x.c}"></span>`).join("")}</div>${s>=3?`<span class="bd" style="background:${lvl(s)[0]}">${s>=6?"!!":"!"}</span>`:""}</button>`}).join("")}</div>`}
 if(S.view=="week"){const st=add(d,-t.getDay());g=`<div class="grid md:grid-cols-7 gap-2">${[...Array(7)].map((_,i)=>{const c=add(st,i);return `<div class="cell ${c==d?"sel":""}" onclick="sel('${c}')"><b class="text-xs">${DAYS[i]} ${pd(c).getDate()}</b>${items(c).map(x=>`<div class="text-xs" style="border-left:3px solid ${x.c};padding-left:4px;margin-top:2px">${x.time} ${esc(x.title)}</div>`).join("")}</div>`}).join("")}</div>`}
 const it=items(d),ov=D.ov[d]||{};
 return `<div class="card"><div class="flex flex-wrap items-center gap-2 mb-3"><button class="btn g" onclick="nav(-1)">‹</button><b class="flex-1 text-center">${t.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</b><button class="btn g" onclick="nav(1)">›</button><button class="btn g" onclick="sel(ds(new Date()))">Today</button>
 ${["day","week","month"].map(v=>`<button class="btn ${S.view==v?"":"g"}" onclick="S.view='${v}';R()">${v[0].toUpperCase()+v.slice(1)}</button>`).join("")}</div>${g}</div>
 <div class="card mt-3"><h2>Agenda ${ov.school?`<span class="bd" style="background:#64748b">School off: ${esc(ov.why||"")}</span>`:""}</h2>${it.map(x=>`<div class="flex items-center gap-2 py-1" style="border-bottom:1px solid var(--b)"><input type="checkbox" ${isDone(x,d)?"checked":""} onchange="tg('${dk(x,d)}')"><span class="bd" style="background:${x.c}">${x.k=="event"?"event":x.k}</span><div class="flex-1" style="${isDone(x,d)?"text-decoration:line-through;opacity:.5":""}"><div class="text-sm">${x.time?x.time+(x.end?"–"+x.end:"")+" · ":""}${esc(x.title)}</div><div class="m">${esc(x.sub||"")}</div></div><button onclick="hide('${x.id}')" title="Remove on this date only">✕</button></div>`).join("")||`<div class="m">Nothing scheduled.</div>`}
 <div class="flex gap-2 mt-3"><input id="qt" class="in" placeholder="Quick add to-do for this date" onkeydown="event.key=='Enter'&&qa()"><button class="btn" onclick="qa()">Add</button></div>
 <div class="mt-3 grid sm:grid-cols-4 gap-2 items-end"><div><label>School off from</label><input id="o1" type="date" class="in" value="${d}"></div><div><label>to</label><input id="o2" type="date" class="in" value="${d}"></div><div><label>Reason</label><select id="o3" class="in"><option>Sick leave</option><option>Dispensation</option><option>National holiday</option></select></div><button class="btn" onclick="so()">Excuse school</button></div>
 ${ov.school?`<button class="btn g mt-2" onclick="delete D.ov['${d}'].school;save();R()">Restore school for this day</button>`:""}</div>${wlw()}`}
function tg(k){D.done[k]=!D.done[k];save();R()}
function hide(id){(D.ov[S.date]=D.ov[S.date]||{}).hide=[...(D.ov[S.date].hide||[]),id];save();R()}
function qa(){const v=$("#qt").value.trim();if(!v)return;(D.daily_todos[S.date]=D.daily_todos[S.date]||[]).push({id:uid(),t:v});save();R()}
function so(){let a=$("#o1").value,b=$("#o2").value;if(!a||!b||b<a)return toast("Check the date range");for(let d=a;d<=b;d=add(d,1))D.ov[d]=Object.assign(D.ov[d]||{},{school:1,why:$("#o3").value});save();R()}
function school(){return `<div class="card overflow-x-auto"><h2>Weekly timetable</h2><table class="w-full" style="min-width:640px"><tr><th></th>${[1,2,3,4,5].map(i=>`<th class="m">${DAYS[i]}</th>`).join("")}</tr>${JP.map((j,i)=>(i==6?`<tr><td colspan="6" class="text-center m py-1">🍽 LUNCH BREAK 12:10 – 13:05</td></tr>`:"")+`<tr><td class="m" style="white-space:nowrap">JP ${i+1}<br>${j[0]}–${j[1]}</td>${[1,2,3,4,5].map(w=>{const x=D.schedules[w+"-"+i]||{};return `<td class="p-1">${[["s","Subject"],["r","Room"],["t","Teacher"]].map(f=>`<input class="in" style="padding:3px 6px;font-size:12px;margin-bottom:2px" list="${f[0]=="s"?"subs":""}" placeholder="${f[1]}" value="${esc(x[f[0]]||"")}" onchange="ss(${w},${i},'${f[0]}',this.value)">`).join("")}</td>`}).join("")}</tr>`).join("")}</table><datalist id="subs">${subs().map(s=>`<option>${esc(s)}</option>`).join("")}</datalist></div>
 <div class="card mt-3"><h2>Add assignment / exam / reminder</h2><div class="flex gap-2 mb-2"><input id="as_ai" class="in" placeholder='✨ Try: "Physics chapter 3 from Mr Budi tomorrow at 8 pm"'><button class="btn" onclick="ai()">Parse</button></div>
 <div class="grid sm:grid-cols-4 gap-2"><div><label>Subject</label><input id="as_sub" list="subs" class="in" onchange="dl()"></div><div><label>Teacher</label><input id="as_teacher" class="in"></div><div><label>Type</label><select id="as_type" class="in"><option>Task</option><option>Exam</option><option>Reminder</option></select></div><div><label>Priority</label><select id="as_pri" class="in"><option>Medium</option><option>High</option><option>Low</option></select></div></div>
 <div class="mt-2"><label>Description</label><input id="as_desc" class="in"></div><div class="grid sm:grid-cols-2 gap-2 mt-2"><div><label>Deadline</label><select id="as_mode" class="in" onchange="dl()"><option value="next">Next meeting</option><option value="spec">Specific meeting</option><option value="custom">Custom date &amp; time</option></select></div><div><label>&nbsp;</label><div id="as_dl"></div></div></div><button class="btn mt-3" onclick="addA()">Add</button></div>
 <div class="card mt-3"><h2>Assignments</h2>${[...D.assignments].sort((a,b)=>a.due<b.due?-1:1).map(a=>{const x={id:"a"+a.id},d=a.due.slice(0,10),ms=new Date(a.due)-new Date(),h=ms/36e5;return `<div class="flex items-center gap-2 py-1" style="border-bottom:1px solid var(--b)"><input type="checkbox" ${isDone(x,d)?"checked":""} onchange="tg('${dk(x,d)}')"><div class="flex-1 text-sm" style="${isDone(x,d)?"text-decoration:line-through;opacity:.5":""}"><b>${a.type}</b> ${esc(a.subject)} – ${esc(a.desc)}<div class="m">${a.due.replace("T"," ")} · ${a.pri}${a.teacher?" · "+esc(a.teacher):""}${D.focus[a.id]?" · 🍅 "+Math.round(D.focus[a.id]/60)+" min":""}</div></div>${ms<0?`<span class="bd" style="background:#64748b">Overdue</span>`:h<24?`<span class="bd" style="background:#ef4444">⏰ ${h|0}h ${Math.round(h%1*60)}m left</span>`:h<72?`<span class="bd" style="background:#f59e0b">${Math.ceil(h/24)}d left</span>`:""}<button onclick="D.assignments=D.assignments.filter(z=>z.id!=${a.id});save();R()">🗑</button></div>`}).join("")||`<div class="m">No assignments yet.</div>`}</div>`}
function ss(w,i,f,v){const k=w+"-"+i;D.schedules[k]=D.schedules[k]||{s:"",r:"",t:""};D.schedules[k][f]=v.trim();save();$("#subs").innerHTML=subs().map(s=>`<option>${esc(s)}</option>`).join("")}
function dl(){const m=$("#as_mode").value,s=$("#as_sub").value.trim(),ms=s?meet(s):[];$("#as_dl").innerHTML=m=="custom"?`<input id="as_dt" type="datetime-local" class="in">`:ms.length?(m=="next"?`<div class="text-sm">Next: <b>${fmt(ms[0])}</b></div>`:`<select id="as_sp" class="in">${ms.map((x,i)=>`<option value="${i}">${fmt(x)}</option>`).join("")}</select>`):`<div class="m">No meetings found for this subject. Fill the timetable or pick a custom date.</div>`}
function addA(){const s=$("#as_sub").value.trim(),m=$("#as_mode").value;if(!s)return toast("Pick a subject");let due;
 if(m=="custom")due=($("#as_dt")||{}).value;else{const ms=meet(s),x=ms[m=="next"?0:+($("#as_sp")||{}).value||0];due=x&&x.d+"T"+x.t}
 if(!due)return toast("Choose a valid deadline");D.assignments.push({id:uid(),subject:s,teacher:$("#as_teacher").value.trim(),type:$("#as_type").value,pri:$("#as_pri").value,desc:$("#as_desc").value.trim()||"Untitled",due:due.slice(0,16)});save();R()}
function ai(){const q=$("#as_ai").value,L=q.toLowerCase(),sb=subs().find(s=>L.includes(s.toLowerCase()));let sub=sb;
 if(!sub){const m=q.match(/(?:tugas|ujian|ulangan|task|exam|test|homework|reminder)\s+([\p{L} ]+?)(?:\s+(?:bab|chapter|ch|dari|from|besok|tomorrow|today|lusa|hari|jam|at|on|pada)\b|$)/iu)||q.match(/^([\p{L}]+)/u);sub=m&&m[1].trim()}
 const T=q.match(/(?:dari|from|oleh)\s+((?:pak|bu|ibu|bapak|mr\.?|ms\.?|mrs\.?|miss)\s+\w+)/i),ch=q.match(/(bab|chapter|ch\.?)\s*\d+/i);
 $("#as_sub").value=sub?sub[0].toUpperCase()+sub.slice(1):"";$("#as_teacher").value=T?T[1]:"";$("#as_type").value=/ujian|ulangan|exam|test|quiz/i.test(q)?"Exam":/reminder|ingat/i.test(q)?"Reminder":"Task";$("#as_desc").value=ch?ch[0]:q;
 let d=null,t=ds(new Date());if(/besok|tomorrow/i.test(L))d=add(t,1);else if(/lusa/i.test(L))d=add(t,2);else if(/hari ini|today/i.test(L))d=t;
 const wd={minggu:0,sunday:0,senin:1,monday:1,selasa:2,tuesday:2,rabu:3,wednesday:3,kamis:4,thursday:4,jumat:5,friday:5,sabtu:6,saturday:6};for(const k in wd)if(!d&&L.includes(k)){let n=(wd[k]-pd(t).getDay()+7)%7||7;d=add(t,n)}
 const dm=q.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?/);if(dm&&!d)d=`${dm[3]||new Date().getFullYear()}-${pad(dm[2])}-${pad(dm[1])}`;
 const tm=q.match(/(?:jam|pukul|at)\s*(\d{1,2})(?:[:.](\d{2}))?\s*(pagi|siang|sore|malam|am|pm)?|\b(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm)\b/i);let time=null;
 if(tm){let h=+(tm[1]||tm[4]),mn=tm[2]||tm[5]||"00",p=(tm[3]||tm[6]||"").toLowerCase();if((p=="pm"||p=="malam"||p=="sore")&&h<12)h+=12;if(p=="siang"&&h<11)h+=12;if(p=="am"&&h==12)h=0;time=pad(h)+":"+mn}
 if(d||time){$("#as_mode").value="custom";dl();$("#as_dt").value=(d||add(t,1))+"T"+(time||"08:00")}else{$("#as_mode").value="next";dl()}toast("Form filled by the task parser. Review and press Add.")}
function comp(){return `<div class="card"><h2>New program</h2><div class="grid sm:grid-cols-3 gap-2"><div class="sm:col-span-2"><label>Name</label><input id="cn" class="in" placeholder="e.g. National Science Olympiad"></div><div><label>Type</label><select id="ct" class="in"><option>Olympiad</option><option>Competition</option><option>Training</option></select></div></div>
 <div class="mt-3"><label>Stages</label>${S.ns.map((s,i)=>`<div class="grid sm:grid-cols-5 gap-2 mb-1"><input class="in" placeholder="Stage name" value="${esc(s.name)}" oninput="S.ns[${i}].name=this.value"><input class="in" type="datetime-local" value="${s.dt}" oninput="S.ns[${i}].dt=this.value"><input class="in" placeholder="Location / link" value="${esc(s.loc)}" oninput="S.ns[${i}].loc=this.value"><select class="in" onchange="S.ns[${i}].status=this.value">${STAT.map(x=>`<option ${x==s.status?"selected":""}>${x}</option>`).join("")}</select><button class="btn g" onclick="S.ns.splice(${i},1);R()">✕</button></div>`).join("")}</div>
 <div class="flex gap-2 mt-2"><button class="btn g" onclick="S.ns.push({name:'Round '+(S.ns.length+1),dt:'',loc:'',status:'Not Started'});R()">+ Stage</button><button class="btn" onclick="addC()">Save program</button></div></div>
 ${D.competitions.map(c=>{let dead;return `<div class="card mt-3"><div class="flex"><h2 class="flex-1">🏆 ${esc(c.name)} <span class="m">${c.type}</span></h2><button onclick="D.competitions=D.competitions.filter(z=>z.id!=${c.id});save();R()">🗑</button></div>${[...c.stages].sort((a,b)=>a.dt<b.dt?-1:1).map(s=>{const h=dead;if(s.status=="Failed")dead=1;return `<div class="flex flex-wrap items-center gap-2 py-1" style="border-bottom:1px solid var(--b);${h?"opacity:.4":""}"><div class="flex-1 text-sm"><b>${esc(s.name)}</b> · ${s.dt.replace("T"," ")||"No date"}<div class="m">${esc(s.loc)}${h?" · hidden from calendar (earlier round failed)":""}</div></div><select class="in" style="width:auto" onchange="us(${c.id},${s.id},this.value)">${STAT.map(x=>`<option ${x==s.status?"selected":""}>${x}</option>`).join("")}</select></div>`}).join("")}</div>`}).join("")}`}
function addC(){const n=$("#cn").value.trim();if(!n)return toast("Enter a name");D.competitions.push({id:uid(),name:n,type:$("#ct").value,stages:S.ns.map(s=>({...s,id:uid()}))});S.ns=[{name:"Round 1",dt:"",loc:"",status:"Not Started"}];save();R()}
function us(c,s,v){D.competitions.find(x=>x.id==c).stages.find(x=>x.id==s).status=v;save();R()}
function ev(){return `<div class="card"><h2>New event</h2><div class="grid sm:grid-cols-4 gap-2"><div class="sm:col-span-2"><label>Title</label><input id="et" class="in"></div><div><label>Category</label><select id="ec" class="in">${Object.keys(CATS).map(c=>`<option>${c}</option>`).join("")}</select></div><div><label>Duration</label><select id="ed" class="in"><option value="time">Specific hours</option><option value="all">All day</option><option value="multi">Multi-day</option></select></div>
 <div><label>Start date</label><input id="e1" type="date" class="in" value="${S.date}"></div><div><label>Start time</label><input id="e2" type="time" class="in" value="09:00"></div><div><label>End time</label><input id="e3" type="time" class="in" value="10:00"></div><div><label>End date (multi-day)</label><input id="e4" type="date" class="in" value="${S.date}"></div>
 <div><label>Repeat</label><select id="er" class="in"><option value="none">None</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="yearly">Yearly</option></select></div><div><label>Every N (interval)</label><input id="en" type="number" min="1" value="1" class="in"></div><div class="sm:col-span-2"><label>Weekly days</label><div class="flex gap-2 text-xs">${DAYS.map((x,i)=>`<label><input type="checkbox" class="wd" value="${i}"> ${x}</label>`).join("")}</div></div>
 <div><label>Goal target (optional)</label><input id="eg" type="number" min="1" class="in" placeholder="e.g. 30"></div><div><label>Unit</label><input id="eu" class="in" placeholder="hours, books…"></div></div><button class="btn mt-3" onclick="addE()">Add event</button></div>
 <div class="card mt-3"><h2>My events &amp; goals</h2>${D.events.map(e=>`<div class="py-2" style="border-bottom:1px solid var(--b)"><div class="flex items-center gap-2"><span class="bd" style="background:${e.color}">${e.cat}</span><div class="flex-1 text-sm"><b>${esc(e.title)}</b> <span class="m">${e.date}${e.endDate>e.date?" → "+e.endDate:""} ${e.allday?"All day":e.time+"–"+e.end} ${e.rec.t!="none"?"· repeats "+e.rec.t+" ×"+e.rec.n:""}</span></div><button onclick="D.events=D.events.filter(z=>z.id!=${e.id});save();R()">🗑</button></div>
 ${e.goal?`<div class="flex items-center gap-2 mt-1"><div class="bar flex-1"><i style="width:${Math.min(100,e.goal.cur/e.goal.target*100)}%"></i></div><span class="m">${e.goal.cur}/${e.goal.target} ${esc(e.goal.unit)}</span><button class="btn g" onclick="gp(${e.id},-1)">−</button><button class="btn" onclick="gp(${e.id},1)">+</button></div>`:""}</div>`).join("")||`<div class="m">No events yet.</div>`}</div>`}
function addE(){const t=$("#et").value.trim(),dur=$("#ed").value,d=$("#e1").value;if(!t||!d)return toast("Title and start date are required");const c=$("#ec").value,g=+$("#eg").value;
 D.events.push({id:uid(),title:t,cat:c,color:CATS[c],date:d,endDate:dur=="multi"?$("#e4").value:d,allday:dur!="time",time:$("#e2").value,end:$("#e3").value,rec:{t:$("#er").value,n:+$("#en").value||1,days:[...document.querySelectorAll(".wd:checked")].map(x=>+x.value)},goal:g?{target:g,cur:0,unit:$("#eu").value}:null});save();R()}
function gp(id,n){const g=D.events.find(e=>e.id==id).goal;g.cur=Math.max(0,g.cur+n);save();R()}
/* ---------- tools ---------- */
function modal(h){$("#mbox").innerHTML=h+`<button class="btn g mt-2" onclick="$('#modal').style.display='none'">Close</button>`;$("#modal").style.display="flex"}
function ics(){const z=x=>x.replace(/[-:]/g,""),L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//AcademicHub//EN"],t=ds(new Date()),st=z(new Date().toISOString().slice(0,19))+"Z";
 for(let i=0;i<90;i++){const d=add(t,i),dd=d.replace(/-/g,"");items(d).filter(x=>x.k!="todo").forEach(x=>L.push("BEGIN:VEVENT",`UID:${x.id}-${dd}@academichub`,"DTSTAMP:"+st,x.time?`DTSTART:${dd}T${x.time.replace(":","")}00`:`DTSTART;VALUE=DATE:${dd}`,...(x.time&&x.end?[`DTEND:${dd}T${x.end.replace(":","")}00`]:[]),"SUMMARY:"+x.title.replace(/[,;]/g,m=>"\\"+m),"END:VEVENT"))}
 return L.concat("END:VCALENDAR").join("\r\n")}
function expo(){modal(`<h2>Export / Import</h2><label>iCalendar (.ics): copy and save as schedule.ics, then import it into Google or Apple Calendar</label><textarea class="in" rows="5" readonly onclick="this.select()">${esc(ics())}</textarea><label class="mt-2" style="display:block">Backup (JSON): paste a backup here and press Import to restore</label><textarea id="bk" class="in" rows="4">${esc(JSON.stringify(D))}</textarea><button class="btn mt-2" onclick="try{D=Object.assign(blank(),JSON.parse($('#bk').value));save();R();$('#modal').style.display='none';toast('Imported')}catch(e){toast('Invalid backup')}">Import</button>`)}
function notif(){try{Notification.requestPermission().then(p=>toast(p=="granted"?"Browser notifications enabled":"Notifications blocked; in-app alerts stay on"))}catch(e){toast("Notifications are not supported here")}}
function chk(){if(!D)return;const n=new Date(),e=new Date(+n+864e5);let c=0;[ds(n),add(ds(n),1)].forEach(d=>items(d).forEach(x=>{if(!x.time||x.k=="todo")return;const t=new Date(d+"T"+x.time);if(t<=n||t>=e||isDone(x,d))return;if(x.k!="school"&&x.k!="event")c++;if((x.k!="school"||t-n<18e5)&&!S.nt[x.id+d]){S.nt[x.id+d]=1;toast("⏰ "+x.title+" · "+x.time);try{Notification.permission=="granted"&&new Notification("Upcoming",{body:x.title+" · "+x.time})}catch(z){}}}));
 const b=$("#bdg");b.style.display=c?"inline-block":"none";b.textContent=c+" due < 24h"}
/* ---------- pomodoro & clock ---------- */
const P={m:"Focus",l:1500,r:0,task:"",n:0};
function pp(){P.r=!P.r;if(P.r&&P.m=="Focus"&&P.l==1500)P.l=(+$("#pf").value||25)*60;$("#pbtn").textContent=P.r?"Pause":"Start";!P.r&&D&&save()}
function pr(){P.r=0;P.m="Focus";P.l=(+$("#pf").value||25)*60;$("#pbtn").textContent="Start";D&&save()}
function tick(){const n=new Date(),h=n.getHours();$("#clk").textContent=n.toLocaleTimeString("en-GB");$("#grt").textContent=(h<5?"Good night":h<11?"Good morning":h<15?"Good afternoon":h<18?"Good evening":"Good night")+(U&&U.email!="guest"?", "+U.email.split("@")[0]:"")+" 👋";
 if(P.r){P.l--;if(P.m=="Focus"&&P.task&&D)D.focus[P.task]=(D.focus[P.task]||0)+1;if(P.l<=0){P.m=P.m=="Focus"?"Break":"Focus";P.l=(+$(P.m=="Focus"?"#pf":"#pb").value||5)*60;toast(P.m=="Break"?"Focus session done. Take a break! ☕":"Break over. Back to focus!");D&&save()}}
 $("#pt").textContent=pad(P.l/60|0)+":"+pad(P.l%60);$("#pm").textContent=P.m;$("#pstat").textContent=D&&P.task&&D.focus[P.task]?"Focused on this task: "+Math.round(D.focus[P.task]/60)+" min":"";
 if(D){let nx=null;D.competitions.forEach(c=>{let dead;[...c.stages].sort((a,b)=>a.dt<b.dt?-1:1).forEach(s=>{if(!dead&&s.dt&&new Date(s.dt)>n&&(!nx||new Date(s.dt)<nx.t)&&s.status!="Completed")nx={t:new Date(s.dt),l:c.name+" – "+s.name};if(s.status=="Failed")dead=1})});
 if(nx){const s=Math.floor((nx.t-n)/1e3);$("#cd").innerHTML=`<b>${esc(nx.l)}</b><div style="font-size:22px;font-variant-numeric:tabular-nums">${s/86400|0}d ${pad(s%86400/3600|0)}:${pad(s%3600/60|0)}:${pad(s%60)}</div>`}else $("#cd").textContent="None scheduled";if(!(P.n++%30))chk()}}
setInterval(tick,1000);tick();initFB();
</script></body></html>
